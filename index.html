<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Digital Pro</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #334155;
    }
    .loader-card {
      text-align: center;
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .spinner {
      border: 4px solid #e2e8f0;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h3 { margin: 0 0 8px 0; font-size: 1.2rem; color: #0f172a; }
    p { margin: 0; font-size: 0.9rem; color: #64748b; }
  </style>

  <script>
    // GANTI LINK DI BAWAH INI DENGAN LINK DEPLOY APPS SCRIPT KAMU DARI LANGKAH 1
    var urlGoogleScript = "https://script.google.com/macros/s/AKfycbx0_0zX4AavXS231Kf7cdmvZ4xXDJV24KsLpS4uq-6On9HaMHEyMa29XbQooU6GH3_r/exec";

    // Mengubah halaman secara otomatis tanpa terpengaruh blokir iframe
    window.location.replace(urlGoogleScript);
  </script>
</head>
<body>

  <div class="loader-card">
    <div class="spinner"></div>
    <h3>Kasir Digital Pro</h3>
    <p>Mengarahkan ke aplikasi...</p>
  </div>

</body>
</html>
