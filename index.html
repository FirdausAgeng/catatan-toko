<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Digital Pro</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #334155;
    }
    .loader-box {
      text-align: center;
    }
    .spinner {
      border: 4px solid #e2e8f0;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script>
    // Langsung arahkan ke URL Web App Apps Script kamu
    window.location.href = "https://script.google.com/macros/s/AKfycbxlntzSQmUXsDnhKOBHPelf5-RAiqqFfHh9mVlIvNrkiMrY3LgW6fmIUjUd35dfEqXe/exec";
  </script>
</head>
<body>
  <div class="loader-box">
    <div class="spinner"></div>
    <p>Mengarahkan ke <strong>Kasir Digital Pro</strong>...</p>
  </div>
</body>
</html>
